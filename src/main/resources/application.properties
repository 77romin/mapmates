spring.application.name=mapmates
server.port=8080

# 개인 키는 application-private.properties (git 미포함) 에 둔다. application-private.properties.example 참고
spring.config.import=optional:classpath:application-private.properties

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/mapmates?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=ssafy
spring.datasource.password=ssafy

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.ssafy.mapmates.dto

# 파일 업로드
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
mapmates.upload-dir=uploads

# 인증 토큰
mapmates.jwt.secret=${MAPMATES_JWT_SECRET:mapmates-local-dev-secret-change-me}
mapmates.jwt.expire-minutes=720

# Spring AI (SSAFY GMS, OpenAI 호환) - 벤더 교체 시 starter 와 이 설정만 바꾸면 된다
spring.ai.openai.base-url=https://gms.ssafy.io/gmsapi/api.openai.com/v1
spring.ai.openai.api-key=${GMS_KEY:not-set}
spring.ai.openai.chat.model=gpt-6-luna
# gpt-6-luna 는 함수 호출(Tool) 사용 시 reasoning_effort=none 이 필요하다
spring.ai.openai.chat.reasoning-effort=none

# 공공데이터포털 (기상청 단기예보, 한국환경공단 전기차 충전소)
datago.service-key=${DATAGO_KEY:}

# RAG AI 서버 (FastAPI)
mapmates.ai-server.url=http://localhost:8000

logging.level.com.ssafy.mapmates=debug
