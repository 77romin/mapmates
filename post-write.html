<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>글쓰기 | 너랑 갈.지도</title>
  <link rel="icon" type="image/png" href="./assets/neorang-galjido-logo-square-v2.png">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/subpages.css">
  <link rel="stylesheet" href="./css/sunset.css">
  <script src="./js/first-visit.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="topbar">
    <a class="brand" href="./index.html"><img class="brand-logo" src="./assets/neorang-galjido-logo-square-v2.png" alt=""><span>너랑 <strong>갈.지도</strong></span></a>
    <div></div>
    <nav class="desktop-nav" aria-label="주요 메뉴"><a class="nav-item" data-page-link="explore" href="./index.html">지도 탐색</a><a class="nav-item" data-page-link="planner" href="./planner.html">여행 계획</a><a class="nav-item" data-page-link="companions" href="./companions.html">동행 찾기</a><a class="nav-item" data-page-link="community" href="./community.html">커뮤니티</a></nav>
    <div class="topbar-actions"><a class="profile-button" href="./mypage.html"><span class="avatar" data-user-avatar></span><span class="profile-name" data-user-name></span></a></div>
  </header>

  <main class="subpage-main" id="main">
    <div class="subpage-shell is-narrow">
      <header class="subpage-header">
        <div><p class="eyebrow" id="write-eyebrow">NEW POST</p><h1 id="write-title">새 글 작성</h1><p>여행자에게 도움이 되는 경험과 정보를 나눠주세요.</p></div>
      </header>
      <form class="subpage-card account-card form-stack" id="post-form" novalidate>
        <label class="field"><span>게시판</span><select id="post-board"><option value="travel">여행정보 공유</option><option value="notice" disabled>공지사항 (운영자 전용)</option><option value="news" disabled>관광 뉴스 (운영자 전용)</option></select></label>
        <label class="field"><span>분류</span><input id="post-category" maxlength="10" required placeholder="예: 제주, 맛집, 팁"></label>
        <label class="field"><span>제목</span><input id="post-title" maxlength="80" required></label>
        <label class="field">
          <span>내용</span>
          <textarea id="post-content" class="post-content-input" maxlength="5000" required aria-describedby="post-length"></textarea>
          <small class="char-count" id="post-length">0 / 5000</small>
        </label>
        <p class="form-error" id="post-error" role="alert"></p>
        <div class="subpage-actions">
          <a class="button button-secondary" id="post-cancel" href="./community.html">취소</a>
          <button class="button button-primary" id="post-submit" type="submit">게시하기</button>
        </div>
      </form>
    </div>
  </main>

  <nav class="mobile-nav" aria-label="모바일 메뉴"><a data-page-link="explore" href="./index.html"><span>⌖</span>지도</a><a data-page-link="planner" href="./planner.html"><span>☷</span>일정</a><a data-page-link="companions" href="./companions.html"><span>♙</span>동행</a><a data-page-link="community" href="./community.html"><span>□</span>라운지</a><a data-page-link="mypage" href="./mypage.html"><span>○</span>MY</a></nav>
  <div class="toast-container" id="toast-container" aria-live="polite"></div>
  <script type="module" src="./js/post-write.js"></script>
</body>
</html>
