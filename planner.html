<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>여행 계획 | 너랑 갈.지도</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/subpages.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문 바로가기</a>
    <header class="topbar">
      <a class="brand" href="./index.html"><span class="brand-mark"><span></span></span><span>너랑 <strong>갈.지도</strong></span></a>
      <form class="topbar-search" id="global-search-form"><span class="icon icon-search"></span><input id="global-search-input" type="search" placeholder="장소를 검색해보세요" /><button type="submit">검색</button></form>
      <nav class="desktop-nav"><a class="nav-item" data-page-link="explore" href="./index.html">지도 탐색</a><a class="nav-item" data-page-link="planner" href="./planner.html">여행 계획</a><a class="nav-item" data-page-link="companions" href="./companions.html">동행 찾기</a><a class="nav-item" data-page-link="community" href="./community.html">커뮤니티</a></nav>
      <div class="topbar-actions"><a class="profile-button" href="./mypage.html"><span class="avatar" data-user-avatar>강</span><span class="profile-name" data-user-name>김강민</span></a></div>
    </header>
    <main class="subpage-main" id="main-content">
      <div class="subpage-shell">
        <header class="subpage-header">
          <div><p class="eyebrow">TRIP PLANNER</p><h1>여행 계획</h1><p>장소별 여행 시각과 메모를 정리하고 실제 차량 경로를 확인하세요.</p></div>
          <div class="subpage-actions"><a class="button button-secondary" href="./index.html">＋ 지도에서 장소 추가</a><button class="button button-primary" id="publish-companion" type="button">동행 구하기</button></div>
        </header>
        <div class="planner-page-grid">
          <section class="subpage-card planner-board">
            <div class="section-title-row"><div><span class="status-badge navy">저장됨</span><h2 id="trip-title">제주, 우리 둘의 지도</h2></div><button class="button button-secondary" id="save-plan" type="button">저장</button></div>
            <div class="planner-summary"><strong id="trip-dates">2026.10.12 - 2026.10.14</strong><span>2박 3일</span><span>여행지 시각순 자동 정렬</span></div>
            <div class="day-tabs" id="day-tabs"><button class="is-active" type="button" data-day="1">DAY 1 <small>10.12</small></button><button type="button" data-day="2">DAY 2 <small>10.13</small></button><button type="button" data-day="3">DAY 3 <small>10.14</small></button></div>
            <div class="planner-weather" id="planner-weather" aria-label="일자별 날씨"></div>
            <div class="schedule-list" id="schedule-list"></div>
          </section>
          <aside class="planner-side-stack">
            <section class="subpage-card planner-map-card">
              <div class="section-title-row"><h2>경로 선택</h2><div class="route-choice"><button class="is-active" type="button" data-route-mode="straight">직선</button><button type="button" data-route-mode="car">차량</button></div></div>
              <div class="planner-map" id="planner-map" aria-label="여행 경로 지도"></div>
              <p class="route-status" id="route-status">직선 경로를 표시하고 있어요.</p>
            </section>
            <section class="subpage-card"><h2>예상 여행 정보</h2><div class="trip-summary"><div><span>이동 거리</span><strong id="route-distance">-</strong></div><div><span>이동 시간</span><strong id="route-duration">-</strong></div></div></section>
          </aside>
        </div>
      </div>
    </main>
    <nav class="mobile-nav"><a data-page-link="explore" href="./index.html"><span>⌖</span>지도</a><a data-page-link="planner" href="./planner.html"><span>☷</span>일정</a><a data-page-link="companions" href="./companions.html"><span>♙</span>동행</a><a data-page-link="community" href="./community.html"><span>□</span>라운지</a><a href="./mypage.html"><span>○</span>MY</a></nav>
    <div class="toast-container" id="toast-container"></div>
    <script src="./config.js"></script>
    <script type="module" src="./js/planner.js"></script>
  </body>
</html>
