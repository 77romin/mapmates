services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.mysql
      args:
        SEED_DEMO: ${MAPMATES_SEED_DEMO:-true}
    environment:
      TZ: Asia/Seoul
      MYSQL_ROOT_PASSWORD: ${MAPMATES_ROOT_PASSWORD:-local-root-only}
      MYSQL_DATABASE: mapmates
      MYSQL_USER: mapmates
      MYSQL_PASSWORD: ${MAPMATES_DB_PASSWORD:-local-mapmates-only}
    volumes:
      - mapmates-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -umapmates -p$$MYSQL_PASSWORD mapmates -e 'SELECT 1 FROM members LIMIT 1'"]
      interval: 5s
      timeout: 5s
      retries: 60
  web:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      TZ: Asia/Seoul
      MAPMATES_SMTP_HOST: ${MAPMATES_SMTP_HOST:-mail}
      MAPMATES_SMTP_PORT: ${MAPMATES_SMTP_PORT:-1025}
      MAPMATES_SMTP_STARTTLS: ${MAPMATES_SMTP_STARTTLS:-false}
      MAPMATES_SMTP_USER: ${MAPMATES_SMTP_USER:-}
      MAPMATES_SMTP_PASSWORD: ${MAPMATES_SMTP_PASSWORD:-}
      MAPMATES_SMTP_FROM: ${MAPMATES_SMTP_FROM:-no-reply@mapmates.test}
      MAPMATES_PUBLIC_URL: ${MAPMATES_PUBLIC_URL:-http://localhost:8080/mapmates}
      MAPMATES_DB_URL: jdbc:mysql://db:3306/mapmates?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
      MAPMATES_DB_USER: mapmates
      MAPMATES_DB_PASSWORD: ${MAPMATES_DB_PASSWORD:-local-mapmates-only}
      MAPMATES_KAKAO_JS_KEY: ${MAPMATES_KAKAO_JS_KEY:-}
      MAPMATES_WEATHER_API_KEY: ${MAPMATES_WEATHER_API_KEY:-}
      MAPMATES_EV_CHARGER_API_KEY: ${MAPMATES_EV_CHARGER_API_KEY:-}
      MAPMATES_KAKAO_REST_KEY: ${MAPMATES_KAKAO_REST_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/mapmates/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      db:
        condition: service_healthy
  mail:
    image: axllent/mailpit:v1
    ports: ["127.0.0.1:8026:8025"]
volumes:
  mapmates-data:
