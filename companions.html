<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>동행 찾기 | 너랑 갈.지도</title>
  <link rel="icon" type="image/png" href="./assets/neorang-galjido-logo-square-v2.png">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/subpages.css">
  <link rel="stylesheet" href="./css/sunset.css">
  <script src="./js/first-visit.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="topbar">
    <a class="brand" href="./index.html"><img class="brand-logo" src="./assets/neorang-galjido-logo-square-v2.png" alt=""><span>너랑 <strong>갈.지도</strong></span></a>
    <form class="topbar-search" id="global-search-form" role="search"><span class="icon icon-search"></span><input id="global-search-input" placeholder="장소를 검색해보세요" aria-label="장소 검색"><button>검색</button></form>
    <nav class="desktop-nav" aria-label="주요 메뉴"><a class="nav-item" data-page-link="explore" href="./index.html">지도 탐색</a><a class="nav-item" data-page-link="planner" href="./planner.html">여행 계획</a><a class="nav-item" data-page-link="companions" href="./companions.html">동행 찾기</a><a class="nav-item" data-page-link="community" href="./community.html">커뮤니티</a></nav>
    <div class="topbar-actions"><a class="profile-button" href="./mypage.html"><span class="avatar" data-user-avatar></span><span class="profile-name" data-user-name></span></a></div>
  </header>

  <main class="subpage-main" id="main">
    <div class="subpage-shell">
      <header class="subpage-header">
        <div><p class="eyebrow">FIND COMPANIONS</p><h1>동행 찾기</h1><p>여행계획을 살펴보고 마음이 맞는 여행에 참가해보세요.</p></div>
        <a class="button button-primary" href="./planner.html">내 여행계획에서 모집</a>
      </header>

      <form class="subpage-card companion-filters-page" id="companion-filter-form">
        <label class="field"><span>지역</span><select id="companion-region"><option value="all">전체</option><option>제주</option><option>서울</option><option>부산</option><option>강원</option></select></label>
        <label class="field"><span>테마</span><select id="companion-theme"><option value="all">전체</option><option>맛집</option><option>자연</option><option>사진</option><option>문화</option><option>여행</option></select></label>
        <label class="field"><span>상태</span><select id="companion-status"><option value="all">전체</option><option value="open">모집 중</option><option value="soon">마감 임박</option><option value="closed">모집 마감</option></select></label>
        <label class="field"><span>검색어</span><input id="companion-keyword" type="search" placeholder="제목, 소개, 태그"></label>
        <button class="button button-dark" id="companion-search" type="submit">찾아보기</button>
      </form>

      <div class="section-title-row list-heading">
        <div><h2>모집 중인 여행</h2><p><strong id="companion-count">0</strong>개의 여행</p></div>
        <label class="check-filter"><input id="companion-mine" type="checkbox"> 내가 참가한 동행만</label>
      </div>
      <div class="companion-list-grid" id="companion-list" aria-live="polite"></div>
    </div>
  </main>

  <nav class="mobile-nav" aria-label="모바일 메뉴"><a data-page-link="explore" href="./index.html"><span>⌖</span>지도</a><a data-page-link="planner" href="./planner.html"><span>☷</span>일정</a><a data-page-link="companions" href="./companions.html"><span>♙</span>동행</a><a data-page-link="community" href="./community.html"><span>□</span>라운지</a><a data-page-link="mypage" href="./mypage.html"><span>○</span>MY</a></nav>
  <div class="toast-container" id="toast-container" aria-live="polite"></div>
  <script type="module" src="./js/companions.js"></script>
</body>
</html>
