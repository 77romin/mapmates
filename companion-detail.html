<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>동행 상세 | 너랑 갈.지도</title>
  <link rel="icon" type="image/png" href="./assets/neorang-galjido-logo-square-v2.png">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/subpages.css">
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="topbar">
    <a class="brand" href="./index.html"><img class="brand-logo" src="./assets/neorang-galjido-logo-square-v2.png" alt=""><span>너랑 <strong>갈.지도</strong></span></a>
    <form class="topbar-search" id="global-search-form" role="search"><span class="icon icon-search"></span><input id="global-search-input" placeholder="장소를 검색해보세요" aria-label="장소 검색"><button>검색</button></form>
    <nav class="desktop-nav" aria-label="주요 메뉴"><a class="nav-item" data-page-link="explore" href="./index.html">지도 탐색</a><a class="nav-item" data-page-link="planner" href="./planner.html">여행 계획</a><a class="nav-item" data-page-link="companions" href="./companions.html">동행 찾기</a><a class="nav-item" data-page-link="community" href="./community.html">커뮤니티</a></nav>
    <div class="topbar-actions"><a class="profile-button" href="./mypage.html"><span class="avatar" data-user-avatar></span><span class="profile-name" data-user-name></span></a></div>
  </header>

  <main class="subpage-main" id="main">
    <div class="subpage-shell is-narrow">
      <a class="text-button" href="./companions.html">← 동행 목록</a>
      <div id="companion-view">
        <section class="subpage-card detail-hero" id="companion-hero"></section>
        <div class="detail-layout-page">
          <article class="subpage-card detail-content" id="companion-content"></article>
          <aside class="subpage-card detail-sidebar" aria-labelledby="participant-title">
            <h2 id="participant-title">참가자 <span id="participant-count"></span></h2>
            <p class="helper-text"><span class="gender-dot is-male"></span>남성 <span class="gender-dot is-female"></span>여성 테두리로 표시됩니다.</p>
            <ul class="participant-list" id="participant-list"></ul>
            <button class="button button-primary full-width" id="join-companion" type="button">참가 신청</button>
            <p class="helper-text" id="join-help"></p>
          </aside>
        </div>

        <section class="subpage-card settings-panel" id="owner-edit" hidden aria-labelledby="owner-edit-title">
          <h2 id="owner-edit-title">내 모집글 관리</h2>
          <form class="form-grid-page" id="owner-edit-form" novalidate>
            <label class="field is-full"><span>제목</span><input id="owner-title" maxlength="60" required></label>
            <label class="field is-full"><span>소개</span><textarea id="owner-description" maxlength="1000" required></textarea></label>
            <label class="field"><span>여행 날짜</span><input id="owner-dates" maxlength="40" placeholder="예: 10.12 - 10.14"></label>
            <label class="field"><span>모집 인원</span><select id="owner-capacity"></select></label>
            <label class="field is-full"><span>태그 (쉼표로 구분)</span><input id="owner-tags" maxlength="80" placeholder="예: 사진, 카페, 렌터카"></label>
            <label class="check-filter is-full"><input id="owner-closed" type="checkbox"> 모집을 마감합니다</label>
            <p class="form-error is-full" id="owner-error" role="alert"></p>
            <div class="subpage-actions is-full">
              <button class="button button-primary" type="submit">수정 저장</button>
              <button class="danger-button" id="owner-delete" type="button">모집글 삭제</button>
            </div>
          </form>
        </section>
      </div>
      <section class="subpage-card empty-state" id="companion-missing" hidden>
        <div><strong>모집글을 찾을 수 없어요.</strong><span>삭제되었거나 잘못된 주소예요. <a href="./companions.html">동행 목록으로 돌아가기</a></span></div>
      </section>
    </div>
  </main>

  <nav class="mobile-nav" aria-label="모바일 메뉴"><a data-page-link="explore" href="./index.html"><span>⌖</span>지도</a><a data-page-link="planner" href="./planner.html"><span>☷</span>일정</a><a data-page-link="companions" href="./companions.html"><span>♙</span>동행</a><a data-page-link="community" href="./community.html"><span>□</span>라운지</a><a data-page-link="mypage" href="./mypage.html"><span>○</span>MY</a></nav>
  <div class="toast-container" id="toast-container" aria-live="polite"></div>
  <script type="module" src="./js/companion-detail.js"></script>
</body>
</html>
