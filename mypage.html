<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>마이페이지 | 너랑 갈.지도</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/subpages.css">
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="topbar">
    <a class="brand" href="./index.html"><span class="brand-mark"><span></span></span><span>너랑 <strong>갈.지도</strong></span></a>
    <form class="topbar-search" id="global-search-form" role="search"><span class="icon icon-search"></span><input id="global-search-input" placeholder="장소를 검색해보세요" aria-label="장소 검색"><button>검색</button></form>
    <nav class="desktop-nav" aria-label="주요 메뉴"><a class="nav-item" data-page-link="explore" href="./index.html">지도 탐색</a><a class="nav-item" data-page-link="planner" href="./planner.html">여행 계획</a><a class="nav-item" data-page-link="companions" href="./companions.html">동행 찾기</a><a class="nav-item" data-page-link="community" href="./community.html">커뮤니티</a></nav>
    <div class="topbar-actions"><a class="profile-button" href="./mypage.html"><span class="avatar" data-user-avatar></span><span class="profile-name" data-user-name></span></a></div>
  </header>

  <main class="subpage-main" id="main">
    <div class="subpage-shell is-narrow">
      <header class="subpage-card profile-page-hero">
        <div class="photo-preview" id="profile-avatar" aria-hidden="true"></div>
        <div><p class="eyebrow">MY TRAVEL MAP</p><h1 id="profile-heading">내 여행 지도</h1><p class="helper-text">닉네임과 사진은 프로필 수정에서 변경할 수 있어요.</p></div>
        <div class="profile-hero-actions">
          <button class="settings-button" id="settings-toggle" type="button" aria-label="설정 변경" aria-expanded="false" aria-controls="settings-panel">⚙</button>
          <button class="text-button" id="logout-button" type="button">로그아웃</button>
        </div>
      </header>

      <div class="profile-panels">
        <section class="subpage-card" aria-labelledby="profile-edit-title">
          <h2 id="profile-edit-title">프로필 수정</h2>
          <form class="form-stack" id="profile-form">
            <label class="field"><span>닉네임</span><input id="profile-nickname" maxlength="20" required></label>
            <div class="field">
              <span id="profile-photo-label">프로필 사진</span>
              <div class="photo-picker-actions is-row">
                <label class="button button-secondary file-button">사진 선택<input class="sr-only" id="profile-photo" type="file" accept="image/*" aria-labelledby="profile-photo-label"></label>
                <button class="text-button" id="profile-photo-remove" type="button">기본 이미지로</button>
              </div>
            </div>
            <button class="button button-primary" type="submit">프로필 저장</button>
          </form>
        </section>
        <section class="subpage-card" aria-labelledby="fixed-info-title">
          <h2 id="fixed-info-title">고정 계정 정보</h2>
          <div class="form-stack">
            <label class="field"><span>이메일</span><input id="fixed-email" disabled></label>
            <label class="field"><span>이름</span><input id="fixed-name" disabled></label>
            <label class="field"><span>생년월일</span><input id="fixed-birth" disabled></label>
            <label class="field"><span>성별</span><input id="fixed-gender" disabled></label>
          </div>
        </section>
      </div>

      <section class="subpage-card settings-panel" id="settings-panel" hidden aria-labelledby="settings-title">
        <h2 id="settings-title">설정 변경</h2>
        <form class="form-grid-page" id="password-form" novalidate>
          <label class="field is-full"><span>현재 비밀번호</span><input id="current-password" type="password" autocomplete="current-password"></label>
          <label class="field"><span>새 비밀번호</span><input id="new-password" type="password" minlength="8" maxlength="64" autocomplete="new-password" required></label>
          <label class="field"><span>새 비밀번호 확인</span><input id="new-password-confirm" type="password" minlength="8" maxlength="64" autocomplete="new-password" required></label>
          <p class="helper-text is-full">영문과 숫자를 포함해 8자 이상 입력해주세요.</p>
          <p class="form-error is-full" id="password-error" role="alert"></p>
          <button class="button button-secondary is-full" type="submit">비밀번호 변경</button>
        </form>
        <div class="danger-zone">
          <h3>회원탈퇴</h3>
          <p class="helper-text">탈퇴하면 작성한 게시글·댓글·모집글과 동행 참가 기록이 모두 삭제되며 복구할 수 없어요.</p>
          <form class="withdraw-form" id="withdraw-form" novalidate>
            <label class="field" id="withdraw-password-field"><span>비밀번호 확인</span><input id="withdraw-password" type="password" autocomplete="current-password"></label>
            <button class="danger-button" type="submit">회원탈퇴</button>
          </form>
        </div>
      </section>

      <section class="subpage-card activity-panel" aria-labelledby="activity-title">
        <h2 id="activity-title">내 활동</h2>
        <div class="activity-grid">
          <div><h3>내 모집글 <span id="owned-count">0</span></h3><ul class="activity-list" id="owned-companions"></ul></div>
          <div><h3>참가한 동행 <span id="joined-count">0</span></h3><ul class="activity-list" id="joined-companions"></ul></div>
          <div><h3>내가 쓴 글 <span id="post-count">0</span></h3><ul class="activity-list" id="my-posts"></ul></div>
        </div>
      </section>
    </div>
  </main>

  <nav class="mobile-nav" aria-label="모바일 메뉴"><a data-page-link="explore" href="./index.html"><span>⌖</span>지도</a><a data-page-link="planner" href="./planner.html"><span>☷</span>일정</a><a data-page-link="companions" href="./companions.html"><span>♙</span>동행</a><a data-page-link="community" href="./community.html"><span>□</span>라운지</a><a data-page-link="mypage" href="./mypage.html"><span>○</span>MY</a></nav>
  <div class="toast-container" id="toast-container" aria-live="polite"></div>
  <script type="module" src="./js/mypage.js"></script>
</body>
</html>
